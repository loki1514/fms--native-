<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Property Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        #root { 
            width: 393px; 
            height: 852px; 
            position: relative;
            background: linear-gradient(180deg, #4A90D9 0%, #5BA3E8 30%, #87CEEB 60%, #B8D4E8 100%);
            border-radius: 50px;
            overflow: hidden;
            box-shadow: 0 0 0 12px #1a1a1a, 0 0 0 14px #333;
        }

        /* Animated Clouds */
        @keyframes cloudFloat1 {
            0% { transform: translateX(-200px); }
            100% { transform: translateX(450px); }
        }
        @keyframes cloudFloat2 {
            0% { transform: translateX(400px); }
            100% { transform: translateX(-250px); }
        }
        @keyframes cloudFloat3 {
            0% { transform: translateX(-150px); }
            100% { transform: translateX(500px); }
        }
        @keyframes cloudFloat4 {
            0% { transform: translateX(350px); }
            100% { transform: translateX(-200px); }
        }

        .cloud {
            position: absolute;
            opacity: 0.7;
            filter: blur(1px);
        }
        .cloud1 {
            top: 5%;
            animation: cloudFloat1 35s linear infinite;
        }
        .cloud2 {
            top: 15%;
            animation: cloudFloat2 28s linear infinite;
        }
        .cloud3 {
            top: 25%;
            animation: cloudFloat3 22s linear infinite;
        }
        .cloud4 {
            top: 8%;
            animation: cloudFloat4 40s linear infinite;
        }

        /* Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Orb Animations */
        @keyframes orbPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes rotationReverse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }
        @keyframes roundness {
            0%, 60%, 100% { filter: contrast(15); }
            20%, 40% { filter: contrast(3); }
        }
        @keyframes colorize {
            0%, 100% { filter: hue-rotate(0deg); }
            20% { filter: hue-rotate(-30deg); }
            40% { filter: hue-rotate(-60deg); }
            60% { filter: hue-rotate(-90deg); }
            80% { filter: hue-rotate(-45deg); }
        }

        .orb-container {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: orbPulse 2s ease-in-out infinite, colorize 6s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(255, 191, 72, 0.5), 0 10px 25px rgba(190, 74, 29, 0.3);
        }
        .orb-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border-top: 1px solid #ffbf48;
            border-bottom: 1px solid #be4a1d;
            background: linear-gradient(180deg, rgba(255, 191, 72, 0.25), rgba(190, 74, 29, 0.3));
        }
        .orb-svg {
            position: absolute;
            width: 56px;
            height: 56px;
        }
        .orb-svg #clipping {
            animation: roundness 1s linear infinite;
        }
        .orb-svg polygon {
            filter: blur(3px);
        }
        .orb-svg polygon:nth-child(2) {
            transform-origin: 50% 50%;
            animation: rotationReverse 2s linear infinite;
        }
        .orb-svg polygon:nth-child(3) {
            transform-origin: 50% 60%;
            animation: rotation 2s linear infinite;
            animation-delay: -0.67s;
        }
        .orb-svg polygon:nth-child(4) {
            transform-origin: 40% 40%;
            animation: rotationReverse 2s linear infinite;
        }
        .orb-svg polygon:nth-child(5) {
            transform-origin: 40% 40%;
            animation: rotationReverse 2s linear infinite;
            animation-delay: -1s;
        }
        .orb-svg polygon:nth-child(6) {
            transform-origin: 60% 40%;
            animation: rotation 2s linear infinite;
        }
        .orb-svg polygon:nth-child(7) {
            transform-origin: 60% 40%;
            animation: rotation 2s linear infinite;
            animation-delay: -1.33s;
        }
    </style>
</head>

        // ==================== BOTTOM NAV ====================
        const BottomNav = () => (
            <div style={{ 
                position: 'absolute', 
                bottom: 0, 
                left: 0, 
                right: 0, 
                height: '85px', 
                display: 'flex', 
                justifyContent: 'space-around', 
                alignItems: 'flex-start', 
                paddingTop: '10px',
                background: 'linear-gradient(180deg, transparent 0%, rgba(74,144,217,0.3) 100%)',
                zIndex: 40 
            }}>
                <button style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', background: 'none', border: 'none', gap: '4px', paddingTop: '6px', flex: 1 }}>
                    <Icons.Home size={24} color="#fff" />
                </button>
                
                <button style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', background: 'none', border: 'none', gap: '4px', paddingTop: '6px', flex: 1 }}>
                    <Icons.Building size={24} />
                </button>
                
                {/* ORB */}
                <div style={{ 
                    display: 'flex', 
                    flexDirection: 'column', 
                    alignItems: 'center', 
                    justifyContent: 'center',
                    marginTop: '-15px',
                    width: '70px'
                }}>
                    <OriginalOrb />
                </div>
                
                <button style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', background: 'none', border: 'none', gap: '4px', paddingTop: '6px', flex: 1 }}>
                    <Icons.Chart size={24} />
                </button>
                
                <button style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', background: 'none', border: 'none', gap: '4px', paddingTop: '6px', flex: 1 }}>
                    <Icons.User size={24} />
                </button>
            </div>
        );

        // ==================== MAIN DASHBOARD ====================
        const Dashboard = () => {
            const [time, setTime] = useState('9:41');
            
            useEffect(() => {
                const update = () => {
                    const now = new Date();
                    setTime(now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: false }));
                };
                update();
                setInterval(update, 60000);
            }, []);

            return (
                <div style={{ width: '100%', height: '100%', position: 'relative' }}>
                    {/* Animated Clouds Background */}
                    <AnimatedClouds />

                    {/* Dynamic Island */}
                    <div style={{ 
                        position: 'absolute', 
                        top: '12px', 
                        left: '50%', 
                        transform: 'translateX(-50%)', 
                        width: '126px', 
                        height: '37px', 
                        background: '#000', 
                        borderRadius: '20px', 
                        zIndex: 100 
                    }} />

                    {/* Status Bar */}
                    <div style={{ 
                        position: 'absolute', 
                        top: '14px', 
                        left: '30px', 
                        right: '30px', 
                        display: 'flex', 
                        justifyContent: 'space-between',
                        zIndex: 101 
                    }}>
                        <span style={{ fontSize: '16px', fontWeight: '600', color: '#fff' }}>{time}</span>
                        <div style={{ display: 'flex', gap: '5px' }}>
                            <span style={{ fontSize: '14px' }}>📶</span>
                            <span style={{ fontSize: '14px' }}>🔋</span>
                        </div>
                    </div>

                    <div style={{ 
                        height: '100%', 
                        overflowY: 'auto', 
                        padding: '70px 16px 100px',
                        position: 'relative',
                        zIndex: 10
                    }}>
                        <Header />
                        <SearchBar />
                        <TicketCards />
                        <ChecklistRow />
                        <DSRCard />
                    </div>

                    <BottomNav />
                </div>
            );
        };

        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
